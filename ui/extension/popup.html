<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
<title>Vector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Brand header -->
    <header class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 48 48" role="img" aria-label="Vector">
          <rect width="48" height="48" rx="10.1" fill="#2D5D4F" />
          <path d="M13.1 11.4 L24 36.2 L34.9 11.4" fill="none" stroke="#FAD237" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Vector</div>
        <div class="brand-sub">UI/UX Prompt Review</div>
      </div>
    </header>

    <main>
      <!-- Editor -->
      <section class="card editor">
        <label class="editor-label" for="prompt">Describe the UI you want</label>
        <textarea
          id="prompt"
          rows="4"
          placeholder='e.g. Add a red button at the top right corner labelled "Sign Up" that opens the signup form.'
        ></textarea>

        <div class="examples">
          <button type="button" class="example" data-prompt='Add a red button labelled "Sign Up".'>
            <b>Complete-ish</b><span>red button labelled "Sign Up"</span>
          </button>
          <button type="button" class="example" data-prompt="Create a blue navbar at the top of the page with links Home, About and Contact.">
            <b>Navbar</b><span>blue navbar with links</span>
          </button>
          <button type="button" class="example" data-prompt="I need a button on my homepage.">
            <b>Vague</b><span>a button, that's all</span>
          </button>
        </div>

        <div class="editor-footer">
          <span class="hint">Ctrl/⌘ + Enter</span>
          <button type="button" id="analyze" class="primary">Analyze Prompt</button>
        </div>
      </section>

      <!-- AI settings -->
      <details class="ai-settings">
        <summary>Analysis engine &amp; API settings</summary>
        <div class="ai-body">
          <label>Engine
            <select id="ai-engine">
              <option value="auto">Auto (router + confidence)</option>
              <option value="rules">Rules (offline)</option>
              <option value="bert">BERT (downloads model once)</option>
              <option value="api">LLM (Groq / OpenAI-compatible)</option>
            </select>
          </label>
          <label>Base URL
            <input id="ai-base-url" type="text" placeholder="https://api.groq.com/openai/v1" />
          </label>
          <label>Model
            <input id="ai-model" type="text" placeholder="openai/gpt-oss-120b" />
          </label>
          <label>API key
            <input id="ai-api-key" type="password" placeholder="gsk_..." autocomplete="off" />
          </label>
          <div class="ai-actions">
            <button type="button" id="ai-save" class="btn-ghost">Save settings</button>
            <span id="ai-status" class="hint"></span>
          </div>
        </div>
      </details>

      <!-- Results -->
      <section id="results" class="hidden">
        <div id="stage"></div>
        <div id="route"></div>
        <div id="risk"></div>
        <div id="highlighted"></div>
        <div id="elements"></div>
        <div id="clarify"></div>
        <div id="final"></div>
      </section>

      <footer class="foot">
        Rules, BERT or API · <a href="https://ejajaka.github.io/ui-prompt-linter/" target="_blank" rel="noreferrer">Full app →</a>
      </footer>
    </main>

    <script src="engine.js"></script>
    <script src="ai-config.js"></script>
    <script src="ai-config.local.js"></script>
    <script type="module" src="ai.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
